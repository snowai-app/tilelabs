# The build spec lives here, in the repository, on purpose.
#
# Amplify will otherwise auto-detect a spec and keep it in the console, where
# it can be hand-edited by anyone and read by nobody. That cost docubase an
# afternoon: two console edits, invisible in every diff, on the one app of four
# that would not build.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # NOTHING IS WRITTEN INTO .env.production HERE, DELIBERATELY. Amplify
        # DOES give environment variables to the running app — measured
        # 9 September 2026 on a freshly connected branch, whose /api/health
        # listed EXTRACT_KEY and DOCUMENTS_BUCKET in process.env at request
        # time. The build container is the one that does not get them, which is
        # the reverse of what docubase/AGENTS.md recorded, and it is why the
        # `env | grep` line here and the `env` block in next.config.ts were both
        # removed: inlining substituted an empty string at build time and blinded
        # the code to the real value sitting beside it at runtime.
        #
        # render has never had either mechanism and has always reported
        # keyConfigured:true. That is the shape to copy.
        # A TRAILING SPACE IN A VARIABLE NAME COST 9 SEPTEMBER 2026 ITS MORNING.
        # This app's two settings were stored in Amplify as "EXTRACT_KEY " and
        # "DOCUMENTS_BUCKET " — the names, not the values. The console renders a
        # trailing space invisibly, so every check of that page read as correct,
        # while the build container and the running function could find neither.
        # Five theories, six console visits and four deployments went by; one
        # call to amplify:GetApp showed it immediately.
        #
        # So when a setting is present in the console and absent in the app,
        # read the NAME through the API before theorising about the mechanism:
        #   boto3.client('amplify').get_app(appId=...)['app']['environmentVariables']
        # and look at repr() of each key, not at the console.
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
        # Next's build cache is scratch space for making the *next* build
        # faster and is never read at runtime. In docubase it was 260 MB of a
        # 370 MB bundle against Amplify's 220 MB cap — the whole reason this
        # service exists. Deleted here rather than only in postBuild, because
        # a postBuild-only deletion there did not move the reported size and
        # it was never established why.
        - rm -rf .next/cache
        # The log states the size it produced. This service carries headless
        # Chrome, so it is the one most likely to grow back toward the cap, and
        # a number in the log turns that from a guess into a reading.
        - echo "=== .next size (Amplify caps the bundle at 230686720) ==="
        - du -sb .next
    postBuild:
      commands:
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    # Deliberately not `.next/cache` — it is deleted above. The npm cache does
    # the work that matters on install and lives outside `.next`.
    paths:
      - .npm/**/*
